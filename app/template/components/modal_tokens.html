<!-- 
    app/template/components/modal_tokens.html
    Modal de recarga rápida de Tokens IA para Velzia 2.0.0
-->

<div id="modal-tokens-recarga" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-300">
        <!-- Header -->
        <div class="relative p-6 text-center bg-gradient-to-br from-slate-800 to-slate-900 border-b border-white/5">
            <button onclick="closeTokenModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="w-16 h-16 bg-orange-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-orange-500 text-3xl">bolt</span>
            </div>
            <h3 class="text-2xl font-bold text-white">Recargar Tokens IA</h3>
            <p class="text-slate-400 text-sm mt-1">Potencia tu Scanner IA con más análisis instantáneos.</p>
        </div>

        <!-- Body -->
        <div class="p-6 space-y-4">
            <!-- Pack 1 -->
            <div class="group relative bg-slate-800/50 border border-white/5 rounded-2xl p-4 hover:border-orange-500/50 hover:bg-slate-800 transition-all cursor-pointer" onclick="initiateTokenPurchase('5k')">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-slate-700/50 rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined text-slate-300">inventory_2</span>
                        </div>
                        <div>
                            <h4 class="text-white font-bold">Pack Básico</h4>
                            <p class="text-orange-400 text-xs font-medium">+15 Tokens</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="block text-white font-black text-lg">$5.000</span>
                        <span class="text-[10px] text-slate-500 uppercase">COP</span>
                    </div>
                </div>
            </div>

            <!-- Pack 2 -->
            <div class="group relative bg-slate-800/50 border border-white/5 rounded-2xl p-4 hover:border-indigo-500/50 hover:bg-slate-800 transition-all cursor-pointer" onclick="initiateTokenPurchase('10k')">
                <!-- Badge Popular -->
                <div class="absolute -top-2 right-4 bg-indigo-600 text-[9px] font-black text-white px-2 py-0.5 rounded-full uppercase tracking-widest shadow-lg">Popular</div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-slate-700/50 rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined text-indigo-300">rocket_launch</span>
                        </div>
                        <div>
                            <h4 class="text-white font-bold">Pack Pro</h4>
                            <p class="text-indigo-400 text-xs font-medium">+35 Tokens</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="block text-white font-black text-lg">$10.000</span>
                        <span class="text-[10px] text-slate-500 uppercase">COP</span>
                    </div>
                </div>
            </div>

            <!-- Hint -->
            <p class="text-center text-[10px] text-slate-500 px-4">
                Los tokens extra se acumulan y no expiran. El pago se procesa de forma segura a través de **Mercado Pago**.
            </p>
        </div>

        <!-- Footer -->
        <div class="p-6 bg-slate-950/50 border-t border-white/5">
            <button onclick="closeTokenModal()" class="w-full py-3 rounded-xl border border-slate-700 text-slate-400 font-medium hover:bg-slate-800 hover:text-white transition-all">
                Cerrar ahora
            </button>
        </div>
    </div>
</div>
