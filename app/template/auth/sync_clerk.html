{% extends "common/base.html" %}

{% block title %}Sincronizando...{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-600 dark:text-gray-400 font-medium">Sincronizando tu cuenta...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    window.addEventListener('load', async function () {
        if (window.Clerk) {
            await window.Clerk.load();
            if (window.Clerk.user) {
                const email = window.Clerk.user.primaryEmailAddress.emailAddress;
                const clerk_id = window.Clerk.user.id;

                const response = await fetch('/api/sync-clerk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ clerk_id, email })
                });
                const result = await response.json();
                if (result.success && result.redirect_url) {
                    window.location.href = result.redirect_url;
                } else {
                    console.error('Error syncing:', result.message);
                    window.location.href = "{{ url_for('auth.login') }}";
                }
            } else {
                window.location.href = "{{ url_for('auth.login') }}";
            }
        }
    });
</script>
{% endblock %}
