{% extends "common/base.html" %}

{% block title %}Sincronizando...{% endblock %}

{% block content %}
<div id="sync-container" class="flex flex-col items-center justify-center min-h-[60vh]">
    <div id="sync-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p id="sync-message" class="text-gray-600 dark:text-gray-400 font-medium">Sincronizando tu cuenta...</p>
    <div id="error-container" class="hidden mt-4 text-center">
        <a href="{{ url_for('auth.login') }}" class="px-4 py-2 bg-primary text-white rounded-lg font-bold">Volver a
            intentar</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var LOGIN_URL = "{{ url_for('auth.login') }}";
</script>
<script src="{{ url_for('static', filename='js/sync_clerk.js') }}"></script>
{% endblock %}
