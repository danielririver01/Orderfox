<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Velzia · ¡Tu negocio está listo!</title>
    <link rel="icon" href="{{ url_for('static', filename='img/velzia_robot_chef.png') }}" type="image/png">
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="{{ url_for('static', filename='CSS/material-symbols.css') }}" rel="stylesheet" />
    <script src="{{ url_for('static', filename='js/tailwind.login.js') }}"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/auth.css') }}">
</head>

<body class="antialiased">

    <div class="auth-ambient">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
        <div class="auth-orb auth-orb--3"></div>
    </div>

    <main class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-[440px] mx-auto">
            <div class="auth-card" style="max-width: 100%;">

                <div class="mb-6" style="text-align:center;">
                    <div class="auth-card-icon mb-4"
                        style="background:rgba(22,163,74,.12); border:1px solid rgba(22,163,74,.35);">
                        <span class="material-symbols-outlined" style="color:#22c55e; font-size:1.6rem;">celebration</span>
                    </div>
                    <h1 class="auth-card-title" style="text-align:center;">
                        ¡Listo, <em>{{ business_name }}</em>!
                    </h1>
                    <p class="auth-card-sub" style="text-align:center; margin-top:0.35rem;">
                        Tu negocio fue registrado correctamente.<br>
                        Ahora vamos a configurar tu tienda.
                    </p>
                </div>

                <div style="display:flex; flex-direction:column; gap:1rem;">
                    <a href="{{ setup_url }}"
                        style="display:flex; align-items:center; justify-content:center; gap:0.5rem; min-height:52px; border-radius:14px; background:#15803D; color:#fff; font-weight:700; text-decoration:none;">
                        <span class="material-symbols-outlined">arrow_forward</span>
                        Continuar configuración
                    </a>

                    <button type="button" id="copy-setup-link"
                        style="display:flex; align-items:center; justify-content:center; gap:0.5rem; min-height:48px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); color:#e5e7eb; font-weight:700; cursor:pointer;">
                        <span class="material-symbols-outlined">content_copy</span>
                        Copiar enlace
                    </button>
                    <p id="copy-setup-feedback"
                        style="display:none; text-align:center; color:#22c55e; font-size:0.85rem; font-weight:700;">
                        ¡Copiado! Guárdalo donde quieras.
                    </p>

                    <p style="text-align:center; color:#9ca3af; font-size:0.8rem; margin:0;">
                        Guarda esta página en favoritos para volver cuando quieras.
                    </p>
                </div>

                <script>
                    (function () {
                        var btn = document.getElementById('copy-setup-link');
                        var feedback = document.getElementById('copy-setup-feedback');
                        if (!btn) return;
                        btn.addEventListener('click', function () {
                            var done = function () {
                                if (feedback) feedback.style.display = 'block';
                                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ¡Copiado!';
                            };
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText({{ setup_url | tojson }}).then(done, done);
                            } else {
                                done();
                            }
                        });
                    })();
                </script>

            </div>
        </div>
    </main>

</body>

</html>
