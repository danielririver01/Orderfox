<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Velzia · Inicia sesión</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="{{ url_for('static', filename='img/velzia_robot_chef.png') }}" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap"
        rel="stylesheet" />

    <script src="{{ url_for('static', filename='js/tailwind.login.js') }}"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/auth.css') }}">
</head>

<body class="antialiased">

    <!-- Ambient orbs -->
    <div class="auth-ambient">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
        <div class="auth-orb auth-orb--3"></div>
    </div>

    <div class="auth-split-screen">

        <!-- LEFT — Robot chef hero with light trails -->
        <div class="auth-hero">

            <!-- Animated SVG light trails (similar to Stitch design) -->
            <svg class="auth-light-trails" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="trailGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f97316;stop-opacity:0" />
                        <stop offset="40%" style="stop-color:#f97316;stop-opacity:1" />
                        <stop offset="70%" style="stop-color:#fbbf24;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
                    </linearGradient>
                    <linearGradient id="trailGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0" />
                        <stop offset="35%" style="stop-color:#fbbf24;stop-opacity:0.8" />
                        <stop offset="65%" style="stop-color:#f97316;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
                    </linearGradient>
                </defs>
                <!-- Upper swooping trail -->
                <path class="auth-trail auth-trail--1"
                    d="M -300 220 C -100 120, 150 50, 350 180 C 550 310, 700 200, 900 100" />
                <!-- Lower swooping trail -->
                <path class="auth-trail auth-trail--2"
                    d="M -300 580 C -50 680, 150 500, 350 550 C 550 600, 700 450, 900 520" />
                <!-- Middle subtle trail -->
                <path class="auth-trail auth-trail--3"
                    d="M -200 400 C 50 300, 250 380, 400 300 C 550 220, 700 300, 900 200" />
            </svg>

            <!-- Robot mascot -->
            <div class="auth-hero-robot">
                <img src="{{ url_for('static', filename='img/velzia_robot_chef.png') }}" alt="Velzia Robot Chef"
                    loading="eager">
            </div>


        </div>

        <!-- RIGHT — Dark glassmorphism login -->
        <div class="auth-form-panel">
            <main class="w-full max-w-[420px] mx-auto">

                <div class="auth-card">
                    <div class="auth-card-content">

                        <!-- Icon (Mobile only) -->
                        <div class="auth-card-icon md:hidden">
                            <img src="{{ url_for('static', filename='img/velzia_robot_chef.png') }}" alt="Velzia"
                                class="w-7 h-7">
                        </div>

                        <h1 class="auth-card-title hidden md:block">
                            Bienvenido a <em>Velzia</em>
                        </h1>
                        <p class="auth-card-sub hidden md:block">Tu asistente para gestionar el restaurante</p>

                        {% if get_flashed_messages() %}
                        <div class="max-w-md mx-auto px-2 pt-2 pb-2">
                            {% include 'components/flash_messages.html' %}
                        </div>
                        {% endif %}

                        <!-- Clerk SignIn mounts here -->
                        <div id="clerk-signin" class="w-full min-h-[300px] flex justify-center"></div>

                        <!-- Plans link -->
                        <div class="mt-6 w-full flex flex-col items-center gap-4">
                            <a href="{{ url_for('auth.plans') }}"
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 hover:text-orange-400 transition-all duration-300 flex items-center gap-2 group">
                                <span class="auth-brand-dot group-hover:bg-orange-400 transition-colors"></span>
                                Ver planes y precios
                            </a>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="auth-card-footer">
                        <span>© 2026 Velzia</span>
                        <span class="flex items-center gap-1">
                            <span class="material-symbols-outlined text-[14px]">lock</span>
                            Conexión segura
                        </span>
                    </div>
                </div>

                <!-- Bottom links -->
                <div class="mt-8 flex justify-center gap-6 text-sm text-gray-600 font-medium">
                    <a class="auth-link-soft transition-colors"
                        href="{{ url_for('auth.legal') }}#faq">Ayuda</a>
                    <a class="auth-link-soft transition-colors" href="{{ url_for('auth.legal') }}">Legal</a>
                </div>

            </main>
        </div>

    </div>

    <style>
        /* ——— Clerk dark theme overrides ——— */

        /* OTP inputs */
        .cl-otpCodeFieldInput {
            color: #f5f0eb !important;
            background-color: rgba(40, 34, 28, 0.9) !important;
            border-color: rgba(249, 115, 22, 0.25) !important;
            caret-color: #f97316 !important;
        }

        /* Autocomplete */
        :root {
            --autofill-bg: #1c1814;
            --autofill-text: #f5f0eb;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px var(--autofill-bg) inset !important;
            -webkit-text-fill-color: var(--autofill-text) !important;
            transition: background-color 5000s ease-in-out 0s;
            border-radius: inherit;
        }

        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        input::-webkit-contacts-auto-fill-button,
        input::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            display: none !important;
            pointer-events: none;
            position: absolute;
            right: 0;
        }
    </style>

    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>

    <!-- Clerk Themes -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/themes@latest/dist/index.browser.js"></script>

    <!-- Clerk SDK -->
    {% if config.CLERK_PUBLISHABLE_KEY %}
    <script async crossorigin="anonymous" data-clerk-publishable-key="{{ config.CLERK_PUBLISHABLE_KEY }}"
        src="https://oriented-tortoise-50.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript"></script>
    <script>
        window.addEventListener('load', async function () {
            if (window.Clerk) {
                await window.Clerk.load({
                    localization: {
                        socialButtonsBlockButton__google: "Continuar con Google",
                        socialButtonsBlockButton__facebook: "Continuar con Facebook",
                        signIn: {
                            start: {
                                title: 'Velzia',
                                subtitle: 'Tu asistente para gestionar el restaurante',
                                actionText: '¿No tienes suscripción?',
                                actionLink: 'Ver planes'
                            }
                        },
                        formFieldLabel__emailAddress: "Correo electrónico",
                        formFieldInputPlaceholder__emailAddress: "ejemplo@velzia.com",
                        formFieldLabel__password: "Contraseña",
                        formButtonPrimary: "INICIAR SESIÓN",
                    }
                });

                // Silent Sync — if user already has a Clerk session, sync and redirect
                const hasFlashMessages = document.querySelector('.flash-message') !== null;
                if (window.Clerk.user && !hasFlashMessages) {
                    const signInDiv = document.getElementById('clerk-signin');

                    signInDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-12">
                            <div class="auth-spinner mb-4"></div>
                            <p class="text-xs font-black text-orange-400/70 uppercase tracking-[0.2em] animate-pulse">Sincronizando sesión...</p>
                        </div>
                    `;

                    try {
                        const token = await window.Clerk.session.getToken();
                        const response = await fetch('/api/sync-clerk', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                clerk_id: window.Clerk.user.id,
                                email: window.Clerk.user.primaryEmailAddress.emailAddress,
                                session_id: window.Clerk.session.id
                            })
                        });

                        const result = await response.json();
                        if (result.success && result.redirect_url) {
                            if (result.is_new_user) {
                                const signInDiv = document.getElementById('clerk-signin');
                                signInDiv.innerHTML = `
                                    <div class="flex flex-col items-center justify-center py-12 px-6">
                                        <div class="w-12 h-12 bg-green-500/10 rounded-full flex items-center justify-center mb-4 ring-1 ring-green-500/30">
                                            <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                            </svg>
                                        </div>
                                        <p class="text-sm font-bold text-green-400 text-center mb-2">¡Bienvenido!</p>
                                        <p class="text-xs text-gray-500 text-center mb-4">Tu plan de Prueba Premium (90 días) está activado con 50 créditos IA para Copilot VZ y Scanner IA</p>
                                        <p class="text-xs text-gray-600 text-center">Redirigiendo...</p>
                                    </div>
                                `;
                                setTimeout(() => {
                                    window.location.href = result.redirect_url;
                                }, 1500);
                            } else {
                                window.location.href = result.redirect_url;
                            }
                        } else if (result.error_code === 'USER_NOT_REGISTERED') {
                            await window.Clerk.signOut();
                            const message = result.message || 'Debe registrarse en la plataforma para poder acceder.';
                            const signInDiv = document.getElementById('clerk-signin');
                            signInDiv.innerHTML = `
                                <div class="flex flex-col items-center justify-center py-12 px-6">
                                    <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mb-4 ring-1 ring-red-500/30">
                                        <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                    </div>
                                    <p class="text-sm font-bold text-red-400 text-center mb-4">${message}</p>
                                    <button onclick="window.location.reload()" class="px-5 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold text-sm transition-colors shadow-lg shadow-orange-500/30">
                                        Intentar de nuevo
                                    </button>
                                </div>
                            `;
                            return;
                        } else {
                            throw new Error("Sync failed");
                        }
                    } catch (error) {
                        console.error("Silent sync failed, falling back to manual sign in", error);
                        window.location.reload();
                    }
                    return;
                }

                // Mount Clerk SignIn with dark orange theme
                const signInDiv = document.getElementById('clerk-signin');

                window.Clerk.mountSignIn(signInDiv, {
                    afterSignInUrl: '/',
                    afterSignUpUrl: '/',
                    appearance: {
                        baseTheme: window.Clerk.themes ? window.Clerk.themes.dark : undefined,
                        variables: {
                            colorPrimary: '#f97316',
                            colorBackground: 'transparent',
                            colorText: '#f5f0eb',
                            colorTextSecondary: '#9a9088',
                            colorInputText: '#f5f0eb',
                            colorInputBackground: 'rgba(40, 34, 28, 0.9)',
                            colorNeutral: '#6b7280',
                            borderRadius: '0.75rem',
                        },
                        elements: {
                            rootBox: "w-full flex justify-center",
                            card: "w-full shadow-none border-none bg-transparent p-0",
                            headerTitle: "hidden",
                            headerSubtitle: "hidden",
                            socialButtonsBlockButton: "rounded-xl h-11 border-[rgba(249,115,22,0.2)] bg-[rgba(40,34,28,0.8)] hover:bg-[rgba(55,47,38,0.9)] hover:border-[rgba(249,115,22,0.4)] transition-all font-semibold text-[#f5f0eb]",
                            formButtonPrimary: "bg-[#f97316] hover:bg-[#ea6c0a] text-sm font-bold h-12 rounded-xl shadow-[0_10px_28px_-10px_rgba(249,115,22,0.7)] transition-all",
                            footer: "hidden",
                            dividerRow: "my-5",
                            dividerText: "text-[10px] font-black text-gray-600 uppercase tracking-widest",
                            formFieldInput: 'bg-[rgba(40,34,28,0.9)] border-[rgba(249,115,22,0.2)] focus:ring-[#f97316]/20 focus:border-[#f97316] rounded-xl text-[#f5f0eb] placeholder-gray-600',
                            formFieldLabel: 'text-[#9a9088] font-medium',
                            otpCodeFieldInput: 'text-[#f5f0eb] bg-[rgba(40,34,28,0.9)] border-[rgba(249,115,22,0.25)] caret-[#f97316]',
                            identityPreviewEditButton: 'text-[#f97316]',
                            formResendCodeLink: 'text-[#f97316]',
                            alternativeMethodsBlockButton: 'text-[#f97316]',
                        }
                    }
                });
            }
        });
    </script>
    {% endif %}
</body>

</html>
