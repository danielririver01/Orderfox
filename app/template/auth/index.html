<!DOCTYPE html>
<html class="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Velzia</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link rel="icon"
        href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%2048%2048'%3E%3Cpath%20d%3D'M24%2042L8%2022L16%2010L20%2016H28L32%2010L40%2022L24%2042Z'%20fill%3D'%23f97316'%2F%3E%3Cpath%20d%3D'M24%2042L18%2030L24%2035L30%2030L24%2042Z'%20fill%3D'%23fff'%2F%3E%3Cpath%20d%3D'M24%2038L23%2039.5L24%2041L25%2039.5L24%2038Z'%20fill%3D'%231c1917'%2F%3E%3C/svg%3E"
        type="image/svg+xml">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap"
        rel="stylesheet" />

    <script src="{{ url_for('static', filename='js/tailwind.login.js') }}"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/login.css') }}">
</head>

<body
    class="bg-background-light dark:bg-[#0a0a0a] font-display antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-[420px] mx-auto">

        <div
            class="w-full bg-white dark:bg-[#141414] rounded-xl shadow-lg border border-gray-100 dark:border-[#262626] overflow-hidden">

            <div class="px-8 pt-6 pb-8 flex flex-col items-center">

                <div
                    class="mb-4 flex items-center justify-center h-16 w-16 rounded-full bg-[#f2460d]/10 dark:bg-[#f2460d]/20">
                    <span class="material-symbols-outlined text-[#f2460d] text-[32px]">lunch_dining</span>
                </div>

                <div class="text-center mb-2">
                    <h1 class="text-[#1c110d] dark:text-white text-3xl font-black tracking-tighter uppercase">
                        Velzia
                    </h1>
                </div>

                {% if get_flashed_messages() %}
                <div class="max-w-md mx-auto px-4 pt-4">
                    {% include 'components/flash_messages.html' %}
                </div>
                {% endif %}

                <div id="clerk-signin" class="w-full min-h-[300px] flex justify-center"></div>

                <div class="mt-4 w-full flex flex-col items-center gap-4">
                    <a href="{{ url_for('auth.plans') }}"
                        class="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-500 hover:text-primary transition-all duration-300 flex items-center gap-2 group">
                        <span class="w-1.5 h-1.5 rounded-full bg-zinc-800 group-hover:bg-primary transition-colors"></span>
                        Ver planes y precios
                    </a>
                    <a class="text-xs font-bold text-zinc-600 hover:text-white transition-colors"
                        href="{{ url_for('auth.forgot_password') }}">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>

            <div
                class="bg-gray-50 dark:bg-[#0f0f0f] border-t border-gray-100 dark:border-[#262626] py-4 px-8 flex justify-between items-center text-xs text-gray-400 dark:text-gray-500">
                <span>© 2026 Velzia</span>
                <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-[14px]">lock</span>
                    Seguro
                </span>
            </div>
        </div>

        <style>
            /* Ocultar scrollbar en Clerk container */
            #clerk-signin::-webkit-scrollbar {
                display: none;
            }

            #clerk-signin {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Desactivar autocompletado visual */
            input:-webkit-autofill {
                -webkit-box-shadow: 0 0 0px 1000px transparent inset !important;
                transition: background-color 5000s ease-in-out 0s !important;
            }

            /* 1. DEFINICIÓN DE COLORES (Variables dinámicas) */
            /* Forzar variables de modo oscuro por defecto */
            :root {
                --autofill-bg: #0a0a0a;
                --autofill-text: #ffffff;
            }

            /* Si usas una clase .dark (común en Tailwind/Dashboard) */
            .dark {
                --autofill-bg: #0a0a0a;
                --autofill-text: #ffffff;
            }

            /* 2. APLICACIÓN DEL AUTOFILL DINÁMICO */
            input:-webkit-autofill,
            input:-webkit-autofill:hover,
            input:-webkit-autofill:focus,
            input:-webkit-autofill:active {
                /* Usamos las variables para que el color cambie solo */
                -webkit-box-shadow: 0 0 0 30px var(--autofill-bg) inset !important;
                -webkit-text-fill-color: var(--autofill-text) !important;
                transition: background-color 5000s ease-in-out 0s;
                border-radius: inherit;
                /* Mantiene la estética de tus bordes redondeados */
            }

            /* 3. LIMPIEZA DE ICONOS NATIVOS (Mantenemos tu lógica) */
            input::-ms-reveal,
            input::-ms-clear {
                display: none;
            }

            input::-webkit-contacts-auto-fill-button,
            input::-webkit-credentials-auto-fill-button {
                visibility: hidden;
                display: none !important;
                pointer-events: none;
                position: absolute;
                right: 0;
            }
        </style>

        <style>
            /* Fix: inputs OTP de Clerk invisibles en dark mode
               Clerk renderiza .cl-otpCodeFieldInput con estilos internos que
               pueden no coincidir con nuestras variables de color */
            .cl-otpCodeFieldInput {
                color: #ffffff !important;
                background-color: #1a1a1a !important;
                border-color: #444444 !important;
                caret-color: #f2460d !important;
            }
        </style>

        <div class="mt-8 flex justify-center gap-6 text-sm text-gray-400 dark:text-gray-500 font-medium">
            <a class="hover:text-primary transition-colors"
                href="mailto:{{ SUPPORT_EMAIL }}?subject=Soporte%20Dashboard%20Velzia">Ayuda</a>
            <a class="hover:text-primary transition-colors" href="{{ url_for('auth.privacy') }}">Privacidad</a>
            <a class="hover:text-primary transition-colors" href="{{ url_for('auth.terms') }}">Términos</a>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>

    <!-- Clerk Themes -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/themes@latest/dist/index.browser.js"></script>

    <!-- Clerk SDK -->
    {% if config.CLERK_PUBLISHABLE_KEY %}
    <script async crossorigin="anonymous" data-clerk-publishable-key="{{ config.CLERK_PUBLISHABLE_KEY }}"
        src="https://oriented-tortoise-50.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript"></script>
    <script>
        window.addEventListener('load', async function () {
            if (window.Clerk) {
                await window.Clerk.load({
                    localization: {
                        socialButtonsBlockButton__google: "Continuar con Google",
                        socialButtonsBlockButton__facebook: "Continuar con Facebook",
                        signIn: {
                            start: {
                                title: 'Velzia',
                                subtitle: 'Dashboard Administrativo',
                                actionText: '¿No tienes suscripción?',
                                actionLink: 'Ver planes'
                            }
                        },
                        formFieldLabel__emailAddress: "Correo electrónico",
                        formFieldInputPlaceholder__emailAddress: "ejemplo@velzia.com",
                        formFieldLabel__password: "Contraseña",
                        formButtonPrimary: "INICIAR SESIÓN",
                    }
                });

                // Silent Sync: Si ya hay usuario de Clerk, sincronizar en el fondo
                const hasFlashMessages = document.querySelector('.flash-message') !== null;
                if (window.Clerk.user && !hasFlashMessages) {
                    const signInDiv = document.getElementById('clerk-signin');

                    // Mostrar estado de carga elegante en lugar del formulario
                    signInDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-12">
                            <div class="h-10 w-10 border-4 border-[#f2460d] border-t-transparent rounded-full animate-spin mb-4"></div>
                            <p class="text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-[0.2em] animate-pulse">Sincronizando sesión...</p>
                        </div>
                    `;

                    try {
                        const token = await window.Clerk.session.getToken();
                        const response = await fetch('/api/sync-clerk', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                clerk_id: window.Clerk.user.id,
                                email: window.Clerk.user.primaryEmailAddress.emailAddress,
                                session_id: window.Clerk.session.id
                            })
                        });

                        const result = await response.json();
                        if (result.success && result.redirect_url) {
                            window.location.href = result.redirect_url;
                        } else {
                            throw new Error("Sync failed");
                        }
                    } catch (error) {
                        console.error("Silent sync failed, falling back to manual sign in", error);
                        // Si falla la sincronización silenciosa (ej. sesión de Clerk expirada),
                        // recargar para mostrar el login normal.
                        window.location.reload();
                    }
                    return;
                }

                const signInDiv = document.getElementById('clerk-signin');

                // Determinar si está en modo oscuro
                // Forzar modo oscuro siempre para Velzia Obsidian
                const isDarkMode = true;

                window.Clerk.mountSignIn(signInDiv, {
                    afterSignInUrl: '/', // Volver aquí para que el script detecte al usuario y haga Silent Sync
                    afterSignUpUrl: '/',
                    appearance: {
                        baseTheme: isDarkMode ? (window.Clerk.themes ? window.Clerk.themes.dark : undefined) : undefined,
                        variables: {
                            colorPrimary: '#f2460d',
                            colorBackground: isDarkMode ? '#111' : '#ffffff',
                            colorText: isDarkMode ? '#ffffff' : '#1c110d',
                            colorInputText: isDarkMode ? '#ffffff' : '#1c110d',
                            colorInputBackground: isDarkMode ? '#1a1a1a' : '#fcf9f8',
                        },
                        elements: {
                            rootBox: "w-full flex justify-center",
                            card: "w-full shadow-none border-none bg-transparent p-0",
                            headerTitle: "hidden",
                            headerSubtitle: "hidden",
                            socialButtonsBlockButton: "rounded-lg h-11 border-gray-700 bg-[#1a1a1a] dark:bg-[#1a1a1a] hover:bg-[#222] transition-all",
                            formButtonPrimary: "bg-[#f2460d] hover:bg-[#d63a0a] text-sm font-bold h-11 rounded-lg",
                            footer: "hidden",
                            dividerRow: "my-6",
                            dividerText: "text-[10px] font-black text-gray-500 uppercase tracking-widest",
                            formFieldInput: 'bg-[#fcf9f8] dark:bg-[#0f0f0f] border-[#e8d5ce] dark:border-[#333333] focus:ring-primary/20 focus:border-primary',
                            // Fix: forzar color de texto en inputs OTP (Clerk los estiliza diferente)
                            otpCodeFieldInput: isDarkMode
                                ? 'text-white bg-[#1a1a1a] border-[#444] caret-orange-500'
                                : 'text-[#1c110d] bg-white border-[#e8d5ce] caret-orange-500',
                        }
                    }
                });
            }
        });
    </script>
    {% endif %}
</body>

</html>
