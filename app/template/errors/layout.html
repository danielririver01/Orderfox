<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error - Velzia{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{{ url_for('static', filename='img/velzia_robot_chef.png') }}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#f97316',
                        dark: '#1c1917',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0a0a0a] text-dark dark:text-gray-100 flex items-center justify-center min-h-screen p-4 transition-colors duration-300">
    <div class="max-w-lg w-full text-center">
        {% block content %}{% endblock %}
        
        <div class="mt-8 pt-8 border-t border-gray-200 dark:border-[#262626] transition-colors duration-300">
            <p class="text-xs text-gray-400 dark:text-gray-500">
                &copy; {{ now.year if now else 2026 }} Velzia. Todos los derechos reservados.
            </p>
        </div>
    </div>
</body>
</html>
