<aside id="conv-panel"
    class="vz-drawer">
    <div class="vz-drawer-header">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px] text-[var(--primary)]">bubble_chart</span>
            <span class="font-heading text-sm font-extrabold text-white vz-drawer-header-text">Copilot Estratégico</span>
        </div>
        <div class="flex items-center gap-1">
            <a href="/legal#copilot" target="_blank" title="Acerca de Copilot VZ"
                class="w-7 h-7 rounded-lg hover:bg-white/5 items-center justify-center text-[var(--text-dim)] vz-drawer-header-text">
                <span class="material-symbols-outlined text-[16px]">info</span>
            </a>
            <button type="button" id="vz-sidebar-toggle"
                class="vz-sidebar-toggle w-7 h-7 rounded-lg hover:bg-white/5 items-center justify-center text-[var(--text-dim)]"
                title="Contraer panel">
                <span class="material-symbols-outlined text-[16px]">dock_to_left</span>
            </button>
        </div>
    </div>

    <div class="vz-profile-section">
        <div class="vz-profile-avatar">
            <span class="material-symbols-outlined text-[18px] text-[var(--primary)]">account_circle</span>
        </div>
        <div class="vz-profile-info">
            <p class="vz-profile-name">{{ user.username or restaurant.name or 'Admin' }}</p>
            <p class="vz-profile-plan">{{ plan_name or restaurant.plan_type }}</p>
        </div>
    </div>

    <nav class="px-3 space-y-0.5">
        <button type="button" class="vz-nav-btn" id="btn-new-conv">
            <span class="material-symbols-outlined text-[18px]">chat_bubble</span>
            <span class="vz-sidebar-label">Nueva conversación</span>
        </button>
    </nav>

    <div class="px-4 pt-3 pb-1.5">
        <span class="vz-section-label">Conversaciones</span>
    </div>

    <div class="vz-search-wrap">
        <span class="material-symbols-outlined vz-search-ic">search</span>
        <input id="conv-search" type="text" placeholder="Buscar conversaciones..." autocomplete="off"
            class="vz-search-input" />
    </div>

    <div id="conv-list-area" class="flex-1 overflow-y-auto px-2.5">
        <div id="conv-list" class="space-y-0.5">
            <div id="conv-list-skeleton" class="conv-loading-skeleton">
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
            </div>
        </div>
        <div id="conv-empty-state" class="flex flex-col items-center justify-center py-8 px-4 text-center" hidden>
            <span class="material-symbols-outlined text-[32px] text-[var(--text-dim)] mb-2">chat_bubble_outline</span>
            <p class="text-xs font-semibold text-[var(--text-muted)] mb-3">Todavía no has hablado con el Copilot</p>
            <button type="button" onclick="document.getElementById('btn-new-conv').click()"
                class="px-4 py-2.5 rounded-xl bg-[#f97316] hover:bg-[#fb923c] text-[#0a0a0a] text-[11px] font-black uppercase tracking-wider transition-all active:scale-95">
                Empezar una conversación
            </button>
            <p class="text-[11px] text-[var(--text-dim)] mt-3">Pregúntale por tus ventas o pídele ideas para tu menú</p>
        </div>
    </div>


</aside>
