<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo al Scanner IA...</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0a0a0a; color: #fff; }
        .card { text-align: center; padding: 2rem; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #a3a3a3; font-size: 14px; }
        a { color: #f97316; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <p>Redirigiendo al Scanner IA...</p>
        <noscript>
            <p>Si no eres redirigido automáticamente, <a href="{{ scanner_url }}/flask-auth?flask_token={{ flask_token }}">haz clic aquí</a>.</p>
        </noscript>
    </div>
    <form id="scanner-form" action="{{ scanner_url }}/flask-auth" method="POST" style="display:none">
        <input type="hidden" name="flask_token" value="{{ flask_token }}">
    </form>
    <script>
        document.getElementById('scanner-form').submit();
    </script>
</body>
</html>
