<!-- Modal de Pago / Caja Registradora (reutilizable) -->
<!-- Configuración desde JS: openPaymentModal({ total, orderId, mode }) en js/payment-modal.js -->
<div id="payment-modal"
    class="hidden fixed inset-0 z-[110] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-[#141414] rounded-3xl max-w-sm w-full shadow-2xl border border-[#262626] overflow-hidden flex flex-col"
        style="max-height: calc(100vh - 3rem);">
        <!-- Header -->
        <div class="px-5 py-4 border-b border-[#262626] flex items-center justify-between flex-shrink-0">
            <div>
                <h3 class="text-base font-black text-white tracking-tight">Registrar pago</h3>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-0.5" id="pm-subtitle">Pedido</p>
            </div>
            <button onclick="closePaymentModal()"
                class="w-9 h-9 flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5 rounded-xl transition-all">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <!-- Scrollable body -->
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4 overscroll-contain">
            <!-- Total del pedido -->
            <div class="bg-[#0a0a0a] rounded-xl border border-[#262626] p-4 flex items-center justify-between">
                <span class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em]">Total del pedido</span>
                <span class="text-2xl font-black text-[#f2460d] tracking-tighter" id="pm-total">$0</span>
            </div>

            <!-- Error inline (modo register) -->
            <div id="pm-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold px-4 py-3 rounded-xl"></div>

            <!-- Selector de método -->
            <div class="space-y-2">
                <button type="button" data-pm-method="cash" onclick="selectPaymentMethod('cash')"
                    class="pm-method w-full flex items-center gap-3 p-3.5 rounded-xl border transition-all text-left
                    bg-white/5 border-[#262626] hover:border-[#f2460d]/40">
                    <span class="w-9 h-9 rounded-lg bg-green-500/10 text-green-400 flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-[20px]">payments</span>
                    </span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-sm font-black text-white">Efectivo</span>
                        <span class="block text-[10px] text-gray-500 font-medium">Calcula el cambio a devolver</span>
                    </span>
                    <span class="material-symbols-outlined text-gray-600 text-[18px]">chevron_right</span>
                </button>

                <button type="button" data-pm-method="nequi" onclick="selectPaymentMethod('nequi')"
                    class="pm-method w-full flex items-center gap-3 p-3.5 rounded-xl border transition-all text-left
                    bg-white/5 border-[#262626] hover:border-[#f2460d]/40">
                    <span class="w-9 h-9 rounded-lg bg-pink-500/10 text-pink-400 flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-[20px]">smartphone</span>
                    </span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-sm font-black text-white">Nequi / Bancolombia</span>
                        <span class="block text-[10px] text-gray-500 font-medium">Pago por transferencia</span>
                    </span>
                    <span class="material-symbols-outlined text-gray-600 text-[18px]">chevron_right</span>
                </button>

                <button type="button" data-pm-method="card" onclick="selectPaymentMethod('card')"
                    class="pm-method w-full flex items-center gap-3 p-3.5 rounded-xl border transition-all text-left
                    bg-white/5 border-[#262626] hover:border-[#f2460d]/40">
                    <span class="w-9 h-9 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-[20px]">credit_card</span>
                    </span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-sm font-black text-white">Tarjeta</span>
                        <span class="block text-[10px] text-gray-500 font-medium">Cobro con datáfono</span>
                    </span>
                    <span class="material-symbols-outlined text-gray-600 text-[18px]">chevron_right</span>
                </button>
            </div>

            <!-- Panel Efectivo -->
            <div id="pm-cash-panel" class="hidden space-y-3">
                <div class="h-px bg-[#262626]"></div>
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">¿Con cuánto pagó el cliente?</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-4 flex items-center text-gray-500 font-black text-sm">$</span>
                    <input type="text" inputmode="numeric" id="pm-cash-amount" placeholder="0"
                        class="w-full pl-8 pr-4 py-3.5 bg-[#0a0a0a] border border-[#262626] rounded-xl focus:ring-2 focus:ring-[#f2460d]/20 focus:border-[#f2460d] outline-none transition-all font-black text-2xl text-white placeholder-gray-700 text-right">
                </div>

                <!-- Botones rápidos de billetes -->
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="addBill(1000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$1.000</button>
                    <button type="button" onclick="addBill(2000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$2.000</button>
                    <button type="button" onclick="addBill(5000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$5.000</button>
                    <button type="button" onclick="addBill(10000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$10.000</button>
                    <button type="button" onclick="addBill(20000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$20.000</button>
                    <button type="button" onclick="addBill(50000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$50.000</button>
                    <button type="button" onclick="addBill(100000)" class="bill-btn py-2.5 rounded-xl bg-white/5 border border-[#262626] text-gray-300 hover:bg-white/10 text-xs font-black transition-all active:scale-95">$100.000</button>
                    <button type="button" onclick="clearCash()" class="bill-btn py-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 text-xs font-black transition-all active:scale-95">Limpiar</button>
                </div>

                <!-- Feedback del cambio -->
                <div id="pm-cash-feedback" class="space-y-2">
                    <div id="pm-cash-change" class="hidden bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4 flex items-center justify-between">
                        <span class="text-[10px] font-black text-emerald-400 uppercase tracking-widest">Cambio a devolver</span>
                        <span class="text-xl font-black text-emerald-400" id="pm-cash-change-amount">$0</span>
                    </div>
                    <div id="pm-cash-short" class="hidden bg-red-500/10 border border-red-500/20 rounded-xl p-4 flex items-center justify-between">
                        <span class="text-[10px] font-black text-red-400 uppercase tracking-widest">Falta dinero</span>
                        <span class="text-xl font-black text-red-400" id="pm-cash-short-amount">$0</span>
                    </div>
                </div>
            </div>

            <!-- Panel Nequi/Bancolombia -->
            <div id="pm-transfer-panel" class="hidden space-y-3">
                <div class="h-px bg-[#262626]"></div>
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">¿Por cuál recibes el pago?</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectTransfer('nequi')"
                        class="pm-transfer px-4 py-3.5 rounded-xl bg-pink-500/10 border border-pink-500/20 text-pink-400 text-sm font-black transition-all active:scale-95">Nequi</button>
                    <button type="button" onclick="selectTransfer('bancolombia')"
                        class="pm-transfer px-4 py-3.5 rounded-xl bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 text-sm font-black transition-all active:scale-95">Bancolombia</button>
                </div>
            </div>

            <!-- Panel Tarjeta -->
            <div id="pm-card-panel" class="hidden space-y-3">
                <div class="h-px bg-[#262626]"></div>
                <div class="bg-blue-500/10 border border-blue-500/20 rounded-xl p-4 flex gap-3">
                    <span class="material-symbols-outlined text-blue-400 text-[20px] flex-shrink-0">info</span>
                    <p class="text-xs font-medium text-blue-300 leading-relaxed">Se registra la venta como pago con tarjeta. El cobro se hace con el datáfono de tu establecimiento.</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-5 py-4 border-t border-[#262626] space-y-2 flex-shrink-0">
            <button id="pm-confirm" type="button" onclick="confirmPayment()"
                class="w-full bg-[#f2460d] hover:bg-[#d63a0a] text-white font-black text-[10px] uppercase tracking-widest py-4 rounded-xl shadow-lg shadow-orange-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                Confirmar pago
            </button>
            <button id="pm-secondary" type="button" onclick="submitWithoutPayment()"
                class="w-full text-gray-500 hover:text-gray-300 font-black text-[10px] uppercase tracking-widest py-2.5 rounded-xl transition-colors">
                Solo tomar pedido (sin pago)
            </button>
        </div>
    </div>
</div>
