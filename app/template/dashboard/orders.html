{% extends 'common/base.html' %}
{% block title %}Pedidos{% endblock %}
{% block content %}
<header class="bg-white dark:bg-[#0a0a0a] border-b border-gray-200 dark:border-[#262626] sticky top-0 z-10">
  <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">Pedidos de Hoy</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400" id="orders-count">
        {{ (pending|length + confirmed|length + delivered|length) }} pedidos
      </p>
    </div>
    <div class="flex items-center gap-3">
      <!-- Botón de activar/silenciar notificaciones de sonido -->
      <button id="sound-toggle-btn" title="Activar alertas sonoras" onclick="toggleSound()"
        class="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-[#1a1a1a] text-gray-400 dark:text-gray-500 hover:bg-orange-100 dark:hover:bg-orange-500/10 hover:text-orange-500 transition-all border border-gray-200 dark:border-[#262626]">
        <span class="material-symbols-outlined text-[20px]" id="sound-icon">notifications_off</span>
      </button>
      <a href="{{ url_for('dashboard.index') }}"
        class="text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
        <span class="material-symbols-outlined">close</span>
      </a>
    </div>
  </div>
</header>


<!-- Contenedor principal de pedidos (target del AJAX refresh) -->
<div class="max-w-md mx-auto px-4 py-6 space-y-6" id="orders-container">
  {% include 'dashboard/_orders_list.html' %}
</div>

<!-- FAB -->
<a href="{{ url_for('orders.create') }}"
  class="fixed bottom-24 right-6 bg-[#f2460d] text-white rounded-2xl w-14 h-14 flex items-center justify-center shadow-2xl shadow-orange-500/40 active:scale-95 transition-all z-20">
  <span class="material-symbols-outlined text-[28px]">add</span>
</a>

<!-- Toast -->
<div id="toast"
  class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-2xl hidden z-50 text-sm font-bold flex items-center gap-2">
  <span id="toast-message"></span>
</div>

<script>
  // Pasar el último ID de pedido al JS para detectar nuevos
  const LAST_ORDER_ID = {{ last_order_id }};
</script>
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
<!-- Bottom Navigation -->
{% include 'common/navigation.html' %}
{% endblock %}
