# Modelo de Tests en 3 Tiers (ver AGENTS.md).
# guardian_files = archivos Tier GUARDIAN (CI bloqueante en PR):
#   test_account_deletion, test_employees, test_payment,
#   test_copilot_follow_up_cap, test_cash_register (+cash_shift fusionado),
#   test_user_billing, test_order_idempotency, test_reservations,
#   test_race_conditions, test_business_subscription, test_subscription,
#   test_business_registration, test_register_vertical, test_business_bridge,
#   test_public_menu, test_auth_setup_terms, test_mundos_pos_sso
# Todo test nuevo GUARDIAN lleva @pytest.mark.guardian; lo demás @pytest.mark.module.
# Tier DESECHABLE va a tests/verify_*.py (nunca test_*.py): python_files lo
# excluye del CI pero se corre explícito con `pytest tests/verify_x.py`.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=35
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    guardian: Tier GUARDIAN - dinero/datos/acceso/legal, CI bloqueante en PR
    module: Tier MODULO - contrato por dominio, solo corre si se toca el dominio
