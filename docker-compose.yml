services:
  # Cache/rate-limit compartido de Flask-Limiter (R-08 / VLZ-16).
  # Solo escucha en el loopback del host; sin persistencia: los contadores
  # son efímeros y no vale la pena guardarlos.
  redis:
    image: redis:7-alpine
    container_name: orderfox-redis
    restart: unless-stopped
    command: ["redis-server", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orderfox-net

  orderfox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderfox-app
    restart: unless-stopped
    environment:
      FLASK_DEBUG: "False"
      FLASK_APP: run.py
      SCANNER_IA_URL: http://receipt-scanner:3000
      RATELIMIT_DEFAULT: ${RATELIMIT_DEFAULT:-100000 per day;50000 per hour}
      # Dentro del compose Redis se alcanza por nombre de servicio, no localhost.
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
    env_file:
      - .env
    networks:
      - orderfox-net
    ports:
      - "5000:5000"
    command: ["sh", "-c", "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 3 --timeout 120 run:app"]

  orderfox-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderfox-scheduler
    restart: unless-stopped
    environment:
      FLASK_DEBUG: "False"
      FLASK_APP: run.py
    env_file:
      - .env
    command: ["python", "run_scheduler.py"]
    networks:
      - orderfox-net

  # Requiere el repo hermano ../Receipt-Scanner-AI (privado). Por eso vive
  # tras el profile "scanner": en un clon limpio, `docker compose up -d`
  # levanta app + scheduler sin romperse; con el hermano presente:
  #   docker compose --profile scanner up -d
  receipt-scanner:
    build:
      context: ../Receipt-Scanner-AI
      dockerfile: Dockerfile
    profiles: ["scanner"]
    container_name: receipt-scanner
    restart: unless-stopped
    depends_on:
      orderfox:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ORDERFOX_URL: http://orderfox:5000
      NODE_ENV: production
    env_file:
      - ../Receipt-Scanner-AI/.env
    networks:
      - orderfox-net
    ports:
      - "3000:3000"
    command: ["sh", "-c", "pnpm prisma generate && pnpm start"]

networks:
  orderfox-net:
    name: orderfox-net
    driver: bridge
