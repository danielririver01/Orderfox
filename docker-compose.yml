services:
  orderfox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderfox-app
    restart: unless-stopped
    environment:
      FLASK_DEBUG: "False"
      FLASK_APP: run.py
      SCANNER_IA_URL: http://receipt-scanner:3000
      RATELIMIT_DEFAULT: ${RATELIMIT_DEFAULT:-100000 per day;50000 per hour}
    env_file:
      - .env
    networks:
      - orderfox-net
    ports:
      - "5000:5000"
    command: ["sh", "-c", "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 3 --timeout 120 run:app"]

  orderfox-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderfox-scheduler
    restart: unless-stopped
    environment:
      FLASK_DEBUG: "False"
      FLASK_APP: run.py
    env_file:
      - .env
    command: ["python", "run_scheduler.py"]
    networks:
      - orderfox-net

  receipt-scanner:
    build:
      context: ../Receipt-Scanner-AI
      dockerfile: Dockerfile
    container_name: receipt-scanner
    restart: unless-stopped
    depends_on:
      orderfox:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ORDERFOX_URL: http://orderfox:5000
      NODE_ENV: production
    env_file:
      - ../Receipt-Scanner-AI/.env
    networks:
      - orderfox-net
    ports:
      - "3000:3000"
    command: ["sh", "-c", "pnpm prisma generate && pnpm start"]

networks:
  orderfox-net:
    name: orderfox-net
    driver: bridge
