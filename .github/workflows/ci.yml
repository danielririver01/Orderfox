name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: orderfox
          POSTGRES_PASSWORD: orderfox2026
          POSTGRES_DB: orderfox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://orderfox:orderfox2026@localhost:5432/orderfox_test
      SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
      JWT_SECRET_KEY: ci-test-jwt-secret-key-do-not-use-in-prod
      CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
          python -m pip install --upgrade pip
          pip install psycopg2-binary
          pip install -r requirements-dev.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build CSS
        run: npm run build:css

      - name: Run database migrations
        run: |
          export FLASK_APP=app
          flask db upgrade

      - name: Lint
        run: flake8 app/ --max-line-length=120 --exit-zero

      # Modelo 3 Tiers: PR = solo GUARDIAN (rápido, bloqueante).
      # main = suite completa. Marcado progresivo vía @pytest.mark.guardian;
      # mientras se migra, el job PR corre la lista explícita de archivos guardian.
      - name: Run guardian tests (PR)
        if: github.event_name == 'pull_request'
        run: >-
          pytest --tb=short -q --no-header -k "not TestLLMCallTelemetry"
          -m "guardian or not module"
          tests/test_account_deletion.py tests/test_employees.py tests/test_payment.py
          tests/test_copilot_follow_up_cap.py tests/test_cash_register.py
          tests/test_user_billing.py tests/test_order_idempotency.py
          tests/test_reservations.py tests/test_race_conditions.py
          tests/test_business_subscription.py tests/test_subscription.py
          tests/test_business_registration.py tests/test_register_vertical.py
          tests/test_business_bridge.py tests/test_public_menu.py
          tests/test_auth_setup_terms.py tests/test_mundos_pos_sso.py

      - name: Run full tests (main)
        if: github.event_name != 'pull_request'
        run: pytest --tb=short -q --no-header -k "not TestLLMCallTelemetry"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd /var/www/orderfox
            bash -s < deploy/update_server.sh
