name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: orderfox
          POSTGRES_PASSWORD: orderfox2026
          POSTGRES_DB: orderfox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://orderfox:orderfox2026@localhost:5432/orderfox_test
      SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
      JWT_SECRET_KEY: ci-test-jwt-secret-key-do-not-use-in-prod
      CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
          python -m pip install --upgrade pip
          pip install psycopg2-binary
          pip install -r requirements-dev.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build CSS
        run: npm run build:css

      - name: Run database migrations
        run: |
          export FLASK_APP=app
          flask db upgrade

      - name: Lint
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503,E303,E266,E265,E231,E241,E261,E262,E402,F401,E712,E711,E302,W291,W293,E128,E126,E131,E124,E127,E125,E129,E226,E225,E251,E228,E227,E275,E301,E121,E122,E261,E262,E131

      - name: Run tests
        run: pytest --tb=short -q --no-header

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/orderfox
            bash -s < deploy/update_server.sh
